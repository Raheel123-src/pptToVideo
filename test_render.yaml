services:
  - type: web
    name: pdf-to-img-test
    env: python
    pythonVersion: "3.12"
    buildCommand: |
      pip install --upgrade pip
      pip install -r minimal_requirements.txt
    startCommand: uvicorn test_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12 