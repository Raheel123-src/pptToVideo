services:
  - type: web
    name: pdf-to-img-api
    env: python
    pythonVersion: "3.12"
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: UPLOADS_DIR
        value: uploads 